[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Static site — no build step'"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/js/engines.js"]

# API routing is declared in the function itself (Functions v2 config.path
# = "/api/*" in netlify/functions/api.js), so no /api/* redirect is needed.

# SPA fallback: hash routing means this is just insurance for deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
